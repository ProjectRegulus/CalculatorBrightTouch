<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bright Touch Cleaning · Pricing Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A14A;--gold-2:#A8822F;--gold-soft:#FBF6EA;--blue:#1E8FD5;--blue-2:#0F6AA6;--blue-soft:#EAF4FB;--navy:#1B2A3A;
  --muted:#6C7782;--line:#E6E9ED;--amber:#C9952E;--amber-bg:#FBF3E2;--red:#B8574E;--red-bg:#F9ECEA;--ok-bg:#EAF4FB;
  --text:var(--navy);
  --serif:"Cormorant Garamond",Georgia,serif;--script:"Great Vibes",cursive;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --r:16px;--r-sm:12px;--shadow:0 1px 2px rgba(27,42,58,.04),0 8px 24px rgba(27,42,58,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#1B2A3A}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:#fff;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:500}
h1{font-family:var(--serif);font-size:36px;line-height:1.1;color:var(--navy);letter-spacing:.01em}
h1 .script{display:block;font-family:var(--script);font-weight:400;font-size:28px;color:var(--gold);line-height:1;margin-bottom:-2px}
h2{font-family:var(--serif);font-size:26px;color:var(--navy);line-height:1.2}
h3{font-size:14px;font-weight:600;color:var(--navy);letter-spacing:.04em;text-transform:uppercase}
h4{font-size:13px;font-weight:600;color:var(--muted)}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sub{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{justify-content:space-between}

.app{display:flex;min-height:100%}
.sidebar{width:252px;flex:0 0 252px;background:#fff;border-right:1px solid var(--line);padding:30px 18px 24px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column}
.logo{display:block;width:100%;max-width:190px;margin:0 auto 26px;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--text);text-align:left;position:relative;font-weight:500}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);flex:none}
.nav button:hover{background:var(--gold-soft)}
.nav button.active{background:var(--blue-soft);color:var(--blue-2)}
.nav button.active svg{color:var(--blue)}
.nav button.active::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--gold)}
.nav .group{margin:16px 12px 6px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sidebar .foot{margin-top:auto;padding-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.main{flex:1;min-width:0;padding:36px 40px 80px;max-width:1320px}
.topbar{display:none}
@media (max-width:960px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.12);padding-top:calc(28px + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(27,42,58,.35);z-index:39;display:none}.scrim.show{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar img{height:44px;width:auto}
  .topbar .burger{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
  .topbar .burger svg{width:20px;height:20px;stroke:var(--blue-2);fill:none;stroke-width:1.8;stroke-linecap:round}
  .main{padding:20px 16px 120px}
  h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.page-head{margin-bottom:24px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.page-head p{margin-top:6px;max-width:560px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.quick{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card.gold{border-color:var(--gold)}
.quick{display:grid;gap:12px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
.quick button:hover{border-color:var(--gold);transform:translateY(-2px)}
.quick .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft)}
.quick .ic svg{width:19px;height:19px;stroke:var(--blue-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.quick b{font-weight:600;color:var(--navy);font-size:15px}
.quick span.d{font-size:13px;color:var(--muted);line-height:1.4}
.quick span.r{font-size:12px;color:var(--gold-2);background:var(--gold-soft);padding:3px 8px;border-radius:999px;align-self:flex-start}
.metric{border-left:3px solid var(--gold)}
.metric .lbl{font-size:13px;color:var(--muted)}
.metric .val{font-family:var(--serif);font-size:32px;color:var(--navy);margin-top:4px;line-height:1.1;font-weight:500}
.metric .val.bl{color:var(--blue-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;border:1px solid transparent;transition:background .15s;white-space:nowrap}
.btn.primary{background:var(--blue-2);color:#fff}.btn.primary:hover{background:#0B5688}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--blue-2)}.btn.ghost:hover{background:var(--blue-soft)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--red);border-color:var(--line);background:#fff}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;width:100%;min-height:44px;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field textarea{resize:vertical;min-height:72px}
.field .hint{font-size:12px;color:var(--muted);line-height:1.4}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.fsec{padding:20px 0;border-top:1px solid var(--line)}.fsec:first-child{border-top:0;padding-top:0}
.fsec h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fsec h3 svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--muted);min-height:38px}
.seg button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-2)}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;min-height:44px}
.stepper .n{font-size:13.5px}.stepper .n small{display:block;color:var(--muted);font-size:11.5px}
.stepper .q{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.stepper .q button{width:30px;height:30px;color:var(--blue-2);font-weight:700;font-size:16px}
.stepper .q span{min-width:22px;text-align:center;font-weight:600}
.stepper.on{border-color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 14px;flex-wrap:wrap}
.est{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
@media (max-width:1150px){.est{grid-template-columns:370px 1fr}}
@media (max-width:960px){.est{grid-template-columns:1fr}}
.res-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.addons{display:grid;grid-template-columns:1fr;gap:6px;max-height:360px;overflow:auto;padding-right:4px}
.addon{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 6px 0 0}
.addon .t{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;text-align:left;font-size:13.5px;color:var(--text)}
.addon .t small{color:var(--muted);font-size:11px}
.addon .t b{color:var(--blue-2);font-weight:600;white-space:nowrap}
.addon.on{border-color:var(--blue);background:var(--blue-soft)}
.addon .qty{display:inline-flex;align-items:center;border:1px solid var(--blue);border-radius:999px;background:#fff;font-size:13px}
.addon .qty button{width:28px;height:28px;color:var(--blue-2);font-weight:700}
.addon .qty span{min-width:18px;text-align:center;font-weight:600}

.summary{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);padding:26px;position:relative;box-shadow:var(--shadow)}
.summary .lbl{font-size:13px;color:var(--muted)}
.summary .num{font-family:var(--serif);font-size:60px;line-height:1;margin:6px 0 4px;color:var(--navy);font-weight:500}
.summary .per{font-size:13px;color:var(--muted)}
.summary .say{margin-top:16px;font-size:14.5px;line-height:1.55;max-width:62ch}
.summary .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:600px){.summary .stats{grid-template-columns:repeat(2,1fr)}.summary .num{font-size:46px}}
.summary .stats .k{font-size:12px;color:var(--muted)}.summary .stats .v{font-size:18px;font-weight:600;margin-top:2px;color:var(--blue-2)}
.summary .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tierbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tierbtns button{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;background:#fff}
.tierbtns button small{font-size:12px;color:var(--muted)}
.tierbtns button b{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--navy)}
.tierbtns button.on{border-color:var(--gold);background:var(--gold-soft)}
.tierbtns button.on small{color:var(--gold-2)}
@media (max-width:600px){.tierbtns{grid-template-columns:1fr}}
.lines{display:flex;flex-direction:column}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lines div:last-child{border-bottom:0}
.lines small{display:block;color:var(--muted);font-size:12px}
.lines b{font-weight:600;color:var(--navy);white-space:nowrap}
.lines div.disc b{color:var(--blue-2)}
.lines div.tot{border-top:2px solid var(--gold);margin-top:4px;padding-top:12px}
.lines div.tot b{font-family:var(--serif);font-size:22px;font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.note.warn{background:var(--amber-bg);color:#6B4D0E}.note.crit{background:var(--red-bg);color:#7A3029}.note.ok{background:var(--ok-bg);color:var(--blue-2)}.note.gold{background:var(--gold-soft);color:var(--gold-2)}
.note svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--blue-2)}.pill.warn{background:var(--amber-bg);color:#6B4D0E}.pill.crit{background:var(--red-bg);color:#7A3029}.pill.gold{background:var(--gold-soft);color:var(--gold-2)}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}
@media (max-width:600px){.kv{grid-template-columns:repeat(2,1fr)}}
.kv div{padding:10px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:12px;color:var(--muted)}.kv .v{font-size:18px;font-weight:600;color:var(--navy);margin-top:2px}
details.card{padding:0}
details.card summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
details.card summary::-webkit-details-marker{display:none}
details.card summary .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
details.card[open] summary .chev{transform:rotate(180deg)}
details.card .body{padding:0 22px 22px}
.check{columns:2;column-gap:24px;font-size:13.5px}
@media (max-width:600px){.check{columns:1}}
.check h4{break-after:avoid;margin:10px 0 4px;color:var(--navy);font-family:var(--serif);font-size:16px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.check li{list-style:none;padding:2px 0 2px 18px;position:relative;color:#3C4854}
.check li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.list{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.list th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list td.num,.list th.num{text-align:right}
.list input.cell{width:100%;min-width:120px;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent}
.list input.cell.num{min-width:70px;text-align:right}
.list input.cell:focus{border-color:var(--blue);background:#fff;outline:none}
.empty{text-align:center;padding:40px 24px;border-radius:var(--r);background:var(--gold-soft);color:var(--gold-2)}
.empty h3{color:var(--navy);font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:6px;text-transform:none;letter-spacing:0}
.empty.soft{background:#fff;border:1px dashed var(--gold);color:var(--muted);text-align:left}
.empty.soft h3{text-align:left}
.ref{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px}
.ref span:nth-child(2n){text-align:right;color:var(--navy);font-weight:600}.ref span:nth-child(2n+1){color:var(--muted)}
.areas{display:flex;flex-wrap:wrap;gap:6px}
.areas span{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-2);background:#fff}

.sticky{display:none}
@media (max-width:960px){
  .sticky.show{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;background:#fff;color:var(--navy);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:12px 16px;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(27,42,58,.18)}
  .sticky .l{font-size:12px;color:var(--muted)}.sticky .p{font-family:var(--serif);font-size:26px;line-height:1;font-weight:600}
  .sticky .btn{margin-left:auto;background:var(--blue-2);color:#fff;padding:9px 14px}
}
.modal{position:fixed;inset:0;background:rgba(27,42,58,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal.show{display:flex}
.quote{background:#fff;color:#1B2A3A;width:100%;max-width:780px;border-radius:18px;padding:44px 48px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
@media (max-width:600px){.quote{padding:26px 20px}}
.quote .tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:18px}
.quote .qhead{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #EADFC8;padding-bottom:22px}
.quote .qhead img{width:170px;height:auto}
.quote .qhead .co{text-align:right;font-size:12.5px;color:#6C7782;line-height:1.5}
.quote .qtitle{margin:26px 0 4px}
.quote .qtitle .script{font-family:var(--script);font-size:30px;color:#C9A14A;line-height:1}
.quote .qtitle .big{font-family:var(--serif);font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:#1B2A3A;margin-top:-6px}
.quote .qsub{color:#6C7782;font-size:14px}
.quote .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin:24px 0;padding:20px;border:1px solid #E6E9ED;border-radius:14px}
@media (max-width:600px){.quote .qgrid{grid-template-columns:1fr}}
.quote .qgrid .k{font-size:12px;color:#6C7782}.quote .qgrid .v{font-weight:500;margin-top:2px}
.quote .qlines div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #EEF1F3;font-size:14px}
.quote .qlines div span:last-child{color:#0F6AA6;font-weight:500}
.quote .total{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-radius:14px;border:2px solid #C9A14A;margin-top:18px}
.quote .total .l{font-size:14px}.quote .total .l small{display:block;font-size:12px;color:#6C7782}
.quote .total .p{font-family:var(--serif);font-size:40px;line-height:1;color:#1B2A3A;font-weight:600}
.quote .qcheck{margin-top:22px}
.quote .qcheck .check{font-size:13px}
.quote .qfoot{margin-top:26px;padding-top:14px;border-top:1px solid #EADFC8;font-size:12px;color:#6C7782;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media print{body *{visibility:hidden}.modal,.modal *{visibility:visible}.modal{position:static;background:none;padding:0;display:block}.quote{box-shadow:none;max-width:none;border-radius:0}.quote .tools{display:none}}
</style>

/* ---------- rates from the financial model ---------- */
function rates(){const f=S.fin;const labor=f.employees*f.wage*(1+f.payrollTax/100)*f.billable;const hours=f.employees*f.billable;const breakeven=(f.overhead+labor)/hours;const target=breakeven/(1-f.margin/100);return {labor,hours,breakeven,target}}
/* residential table lookup with linear extension above the last row */
function resPrice(sqft,typeIdx){
  const T=S.resTable, col=typeIdx+1;
  for(const row of T){if(sqft<=row[0])return row[col]}
  const a=T[T.length-2],b=T[T.length-1];const perStep=(b[col]-a[col])/(b[0]-a[0]);
  return b[col]+(sqft-b[0])*perStep;
}
function addCarpet(e,lines,addH){
  const sq=parseFloat(e.carpetSqft)||0,rugs=parseInt(e.rugs)||0;if(!sq&&!rugs)return;
  const c=S.carpet,cond=S.cond[e.condition]||1;
  if(sq){lines.push({n:"Carpet cleaning · "+sq.toLocaleString()+" sqft",s:$(c.rate,2)+"/sqft hot water extraction"+(cond!==1?" × "+cond+" soil":""),v:sq*c.rate*cond});addH(sq/(c.production/cond))}
  if(rugs){lines.push({n:"Area rugs × "+rugs,s:$(c.rug)+" each",v:c.rug*rugs});addH(rugs*0.4)}
}
function tierRow(tiers,sqft){for(const t of tiers){if(sqft<=t[0])return t}return tiers[tiers.length-1]}
function tierRate(tiers,sqft){return tierRow(tiers,sqft)[1]}

/* ---------- engine ---------- */
function calc(e){
  const rt=rates();
  const crew=Math.min(4,Math.max(1,parseInt(e.crew)||1)),eff=S.crew[crew]||1;
  let lines=[],hours=0,chk=null,label="",minPrice=null,coreLabel="";
  const cond=S.cond[e.condition]||1;
  if(e.service==="residential"){
    const sq=parseFloat(e.sqft)||0;if(!sq)return null;
    const idx=S.resTypes.findIndex(t=>t[0]===e.type),t=S.resTypes[idx<0?3:idx];
    chk=e.type==="deep"?"deep":e.type==="move"?"move":"standard";label=t[1];
    const ref=resPrice(sq,idx<0?3:idx);                       // price at the reference $61.42/hr
    const baseHours=ref/S.refRate;                              // hours implied by the 7FC table
    const h=baseHours*cond;
    const target=h*rt.target, breakeven=h*rt.breakeven;
    const price=e.tier==="min"?breakeven:target; var _coreT=target,_coreB=breakeven;
    lines.push({n:t[1]+" · "+sq.toLocaleString()+" sqft",s:(e.tier==="min"?"breakeven pricing":"recommended pricing")+(cond!==1?" · "+e.condition+" condition":""),v:price});
    minPrice=breakeven;coreLabel=t[1];
    hours=h;
    for(const x of (S.addons||[])){const q=parseInt((e.addons||{})[x[0]])||0;if(q){lines.push({n:x[1]+(q>1?" × "+q:""),s:"add-on",v:x[2]*q});hours+=x[3]*q/60}}
    addCarpet(e,lines,x=>hours+=x);
    const tr=S.travel[e.travel];if(tr&&tr.fee)lines.push({n:"Travel fee",s:tr.name,v:tr.fee});
  }else if(e.service==="commercial"){
    const sq=parseFloat(e.sqft)||0;if(!sq)return null;
    const ct=S.com.types[e.ctype]||S.com.types.office;chk=e.ctype==="postcon"?"postcon":e.ctype==="industrial"?"industrial":"commercial";label=ct.name;
    const row=tierRow(ct.tiers,sq), rate=row[1];
    hours=sq/(row[2]/cond);
    const fx=parseInt(e.fixtures)||0;if(fx)hours+=fx*S.com.fixtureMin/60;
    const fq=ct.recurring?(S.com.freq[e.cfreq]||S.com.freq.w1):{name:"One time",m:1};
    let base=sq*rate*cond;
    lines.push({n:ct.name+" · "+sq.toLocaleString()+" sqft",s:$(rate,3)+"/sqft at this size · "+row[2].toLocaleString()+" sqft per labor hour"+(cond!==1?" · "+e.condition+" condition":""),v:base});
    if(ct.recurring&&fq.m!==1){lines.push({n:fq.name+(fq.m<1?" efficiency discount":" adjustment"),s:fq.m<1?Math.round((1-fq.m)*100)+"% off, faster regular cleans":"+"+Math.round((fq.m-1)*100)+"% for less frequent visits",v:base*(fq.m-1),disc:fq.m<1})}
    let price=base*fq.m;
    const floor=(hours/eff)*rt.breakeven, floorT=(hours/eff)*rt.target;
    if(price<floor){lines.push({n:"Minimum for the hours required",s:"adjusted up to cover the crew time",v:floor-price});price=floor}
    if(price<ct.min){lines.push({n:"Minimum service charge",s:$(ct.min),v:ct.min-price});price=ct.min}
    minPrice=Math.max(floor,ct.min);coreLabel=ct.name;
    if(fx)lines.push({n:"Restrooms · "+fx+" fixtures",s:"included in the price above · "+S.com.fixtureMin+" min each",v:0});
    addCarpet(e,lines,x=>hours+=x);
    const tr=S.travel[e.travel];if(tr&&tr.fee)lines.push({n:"Travel fee",s:tr.name,v:tr.fee});
  }else if(e.service==="carpet"){
    chk="carpet";label="Carpet & Rug Cleaning";
    const sq=parseFloat(e.carpetSqft)||0,rugs=parseInt(e.rugs)||0,uph=parseInt(e.uph)||0;if(!sq&&!rugs&&!uph)return null;
    const c=S.carpet;
    if(sq){lines.push({n:"Carpet cleaning · "+sq.toLocaleString()+" sqft",s:$(c.rate,2)+"/sqft"+(cond!==1?" × "+cond+" soil":""),v:sq*c.rate*cond});hours+=sq/(c.production/cond)}
    if(rugs){lines.push({n:"Area / oriental rugs × "+rugs,s:$(c.rug)+" each",v:c.rug*rugs});hours+=rugs*0.4}
    if(uph){lines.push({n:"Upholstery pieces × "+uph,s:$(c.uph)+" each",v:c.uph*uph});hours+=uph*0.5}
    const tr=S.travel[e.travel];if(tr&&tr.fee)lines.push({n:"Travel fee",s:tr.name,v:tr.fee});
  }else{
    chk="laundry";label="Laundry Service";
    const n=parseInt(e.items)||0,tw=parseInt(e.twin)||0,q=parseInt(e.queen)||0,k=parseInt(e.king)||0;if(!n&&!tw&&!q&&!k)return null;
    const L=S.laundry;
    if(n){let rem=n;while(rem>0){const t=L.tiers.find(t=>rem<=t[0])||L.tiers[L.tiers.length-1];const chunk=Math.min(rem,L.tiers[L.tiers.length-1][0]);lines.push({n:"Regular items × "+chunk,s:"tier pricing",v:t[1]});rem-=chunk}hours+=n*L.minPerItem/60}
    if(tw){lines.push({n:"Twin comforter × "+tw,s:$(L.twin)+" each",v:L.twin*tw});hours+=tw*0.25}
    if(q){lines.push({n:"Queen comforter × "+q,s:$(L.queen)+" each",v:L.queen*q});hours+=q*0.3}
    if(k){lines.push({n:"King comforter × "+k,s:$(L.king)+" each",v:L.king*k});hours+=k*0.35}
  }
  const calcHours=hours,ov=parseFloat(e.hoursOverride),overridden=ov>0;if(overridden)hours=ov;
  const adj=hours/eff,tos=adj/crew;
  const price=lines.reduce((a,l)=>a+l.v,0);
  const cost=adj*rt.breakeven, profit=price-cost, margin=price?profit/price:0;
  const laborOnly=adj*S.fin.wage*(1+S.fin.payrollTax/100), laborPct=price?laborOnly/price:0;
  const health=margin>=S.fin.margin/100-0.001?"profitable":margin>0?"marginal":"not";
  const extras=e.service==="residential"?price-(e.tier==="min"?_coreB:_coreT):0;
  const priceAt=e.service==="residential"?{target:_coreT+extras,min:_coreB+extras}:{target:price,min:price};
  return {priceAt,lines,price,hours,calcHours,overridden,crew,eff,adj,tos,cost,profit,margin,laborOnly,laborPct,health,chk,label,rt,minPrice,coreLabel,perHour:price/(adj||1)};
}

function field(l,i,h=""){return `<div class="field"><label>${l}</label>${i}${h?`<div class="hint">${h}</div>`:""}</div>`}
function inp(k,ph="",type="text",attrs=""){return `<input type="${type}" ${attrs} placeholder="${ph}" value="${E[k]??""}" oninput="setE('${k}',this.value)">`}
function sel(k,opts){return `<select onchange="setE('${k}',this.value)">${Object.entries(opts).map(([v,l])=>`<option value="${v}" ${E[k]==v?"selected":""}>${l}</option>`).join("")}</select>`}
function seg(k,opts){return `<div class="seg">${Object.entries(opts).map(([v,l])=>`<button class="${E[k]==v?"on":""}" onclick="setE('${k}','${v}')">${l}</button>`).join("")}</div>`}
function step(k,name,sub){const q=parseInt(E[k])||0;return `<div class="stepper ${q?"on":""}"><div class="n">${name}<small>${sub}</small></div><div class="q"><button onclick="setE('${k}',${Math.max(0,q-1)})" aria-label="less">−</button><span>${q}</span><button onclick="setE('${k}',${q+1})" aria-label="more">+</button></div></div>`}
function toggleAddon(id){E.addons=E.addons||{};if(E.addons[id])delete E.addons[id];else E.addons[id]=1;render()}
function stepAddon(id,d){E.addons=E.addons||{};const q=(parseInt(E.addons[id])||0)+d;if(q<=0)delete E.addons[id];else E.addons[id]=q;render()}
const RERENDER=["type","condition","crew","travel","area","ctype","cfreq","rugs","uph","twin","queen","king","tier"];
function setE(k,v){E[k]=v;if(RERENDER.includes(k)){render();return}R=calc(E);const r=document.getElementById("results");if(r)r.innerHTML=vResults();updateSticky()}
const PRESETS={residential:[["Small apt",900],["Townhome",1500],["3-bed home",2200],["Large home",3500],["Estate",5000]],commercial:[["Suite",3000],["Floor",12000],["Building",50000],["Warehouse",150000],["Large site",300000]]};

function vEstimate(){
  R=calc(E);const s=E.service;
  const areaOpts=Object.fromEntries(S.areas.map(a=>[a,a]));
  const travelOpts=Object.fromEntries(Object.entries(S.travel).map(([k,t])=>[k,t.name+(t.fee?" · +"+$(t.fee):" · free")]));
  const condSeg=field("Condition",seg("condition",{light:"Light",standard:"Standard",heavy:"Heavy",extreme:"Extreme"}),{light:"Well kept, cleaned regularly",standard:"Normal use",heavy:"Months without service · +20% time and price",extreme:"Severe grime, grease or neglect · +40% time and price"}[E.condition]);
  let body="";
  if(s==="residential"){
    body=`<div class="fsec"><h3>${ic("ruler")} The home</h3><div class="form-grid">
      <div class="full">${field("Square footage",inp("sqft","e.g. 1,800","number",'inputmode="decimal" min="0" autofocus'))}<div class="presets" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${PRESETS.residential.map(p=>`<button class="btn ghost sm" onclick="setE('sqft',${p[1]});render()">${p[0]} · ${p[1].toLocaleString()}</button>`).join("")}</div></div>
      <div class="full">${field("Service",seg("type",Object.fromEntries(S.resTypes.map(t=>[t[0],t[1]]))),S.resTypes.find(t=>t[0]===E.type)?.[2]||"")}</div>
    </div></div>
    <div class="fsec"><h3>${ic("star")} Add-on services</h3><p class="small sub" style="margin:-6px 0 10px">Tap to add. Items marked "each" take a quantity.</p>
      <div class="addons">${(S.addons||[]).map(a=>{const q=parseInt((E.addons||{})[a[0]])||0;return `<div class="addon ${q?"on":""}"><button class="t" onclick="toggleAddon('${a[0]}')"><span>${a[1]}${a[4]?' <small>each</small>':''}</span><b>${$(a[2])}</b></button>${q&&a[4]?`<span class="qty"><button onclick="stepAddon('${a[0]}',-1)">−</button><span>${q}</span><button onclick="stepAddon('${a[0]}',1)">+</button></span>`:""}</div>`}).join("")}</div>
    </div>`;
  }else if(s==="commercial"){
    const ct=S.com.types[E.ctype];
    body=`<div class="fsec"><h3>${ic("ruler")} The space</h3><div class="form-grid">
      <div class="full">${field("Type of space",seg("ctype",Object.fromEntries(Object.entries(S.com.types).map(([k,t])=>[k,t.name]))),ct.recurring?"Recurring service · frequency lowers the per-visit price":"One-time project · rate per sqft drops as the site gets bigger")}</div>
      <div class="full">${field("Square footage",inp("sqft","e.g. 6,000","number",'inputmode="decimal" min="0"'),"Rate at this size: "+(E.sqft?$(tierRate(ct.tiers,+E.sqft),3)+"/sqft":ct.tiers.map((t,i)=>(i===ct.tiers.length-1?"over "+ct.tiers[i-1][0].toLocaleString():"≤ "+t[0].toLocaleString())+" · "+$(t[1],3)).join("  ·  ")))}<div class="presets" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${PRESETS.commercial.map(p=>`<button class="btn ghost sm" onclick="setE('sqft',${p[1]});render()">${p[0]} · ${p[1].toLocaleString()}</button>`).join("")}</div></div>
      ${ct.recurring?field("Frequency",sel("cfreq",Object.fromEntries(Object.entries(S.com.freq).map(([k,f])=>[k,f.name+(f.m<1?" · −"+Math.round((1-f.m)*100)+"%":f.m>1?" · +"+Math.round((f.m-1)*100)+"%":"")])))):""}
      ${field("Restroom fixtures",inp("fixtures","0","number",'inputmode="numeric" min="0"'),S.com.fixtureMin+" min each, adds labor time")}
    </div></div>`;
  }else if(s==="carpet"){
    body=`<div class="fsec"><h3>${ic("ruler")} What to clean</h3><div class="form-grid">
      <div class="full">${field("Carpet square footage",inp("carpetSqft","e.g. 800","number",'inputmode="decimal" min="0" autofocus'),$(S.carpet.rate,2)+" per sqft, hot water extraction")}</div>
      ${step("rugs","Area / oriental rugs",$(S.carpet.rug)+" each")}${step("uph","Upholstery pieces",$(S.carpet.uph)+" each")}
    </div></div>`;
  }else{
    body=`<div class="fsec"><h3>${ic("list")} Laundry</h3><div class="form-grid">
      <div class="full">${field("Regular items",inp("items","e.g. 25","number",'inputmode="numeric" min="0" autofocus'),"1–10 $15 · 11–20 $30 · 21–30 $40 · 31–40 $60 · 41–50 $75")}</div>
      ${step("twin","Twin comforters",$(S.laundry.twin)+" each")}${step("queen","Queen comforters",$(S.laundry.queen)+" each")}${step("king","King comforters",$(S.laundry.king)+" each")}
    </div></div>`;
  }
  return `<div class="page-head"><div><h1><span class="script">Cleaning Services</span>${SVC[s].name}</h1><p class="sub">Price on the left, the hours and margin behind it on the right.</p></div></div>
  <div class="tabs">${Object.entries(SVC).map(([k,v])=>`<button class="${k===s?"on":""}" onclick="go('${k}')">${v.name}</button>`).join("")}</div>
  <div class="est"><div class="card">
    ${body}
    ${(s==="residential"||s==="commercial")?`<div class="fsec"><h3>${ic("carpet")} Carpet cleaning (optional)</h3><div class="form-grid">
      ${field("Carpet square footage",inp("carpetSqft","e.g. 500","number",'inputmode="decimal" min="0"'),$(S.carpet.rate,2)+" per sqft, added to the quote · leave blank if none")}
      ${step("rugs","Area rugs",$(S.carpet.rug)+" each")}
    </div></div>`:""}
    <div class="fsec"><h3>${ic("people")} Crew & condition</h3><div class="form-grid">
      ${s==="laundry"?"":`<div class="full">${condSeg}</div>`}
      ${field("Crew size",seg("crew",{1:"1",2:"2",3:"3",4:"4"}),R?`${R.crew} cleaner${R.crew>1?"s":""} · ${hrsNice(R.tos)} on site`:"")}
      ${field("Travel time",sel("travel",travelOpts))}
      <div class="full">${field("Labor hours (optional override)",inp("hoursOverride",R?`Estimated: ${R.calcHours.toFixed(2)} h`:"Total labor hours","number",'inputmode="decimal" min="0" step="0.25"'),R&&R.overridden?`Using your ${R.hours.toFixed(2)} h instead of the estimated ${R.calcHours.toFixed(2)} h.`:"Know this job better than the table? Enter total labor hours (all cleaners combined); the margin updates.")}</div>
    </div></div>
    <div class="fsec"><h3>${ic("user")} Client (for the quote)</h3><div class="form-grid">
      ${field("Client name",inp("client","Jane Doe"))}${field("Service area",sel("area",areaOpts))}
      <div class="full">${field("Address",inp("address","Street, City, MN"))}</div>
      <div class="full">${field("Notes for the quote",`<textarea placeholder="Gate code, pets, parking, special requests…" oninput="setE('notes',this.value)">${E.notes}</textarea>`)}</div>
    </div></div>
  </div><div class="res-col" id="results">${vResults()}</div></div>`;
}

function explain(){
  const c=R,crew=`${c.crew} cleaner${c.crew>1?"s":""}`;
  let t=`${c.label} in ${E.area}: ${crew} will spend about ${hrsNice(c.tos)} on site (${hrs(c.adj)} of labor${c.overridden?", from your estimate":""}). At your ${$(c.rt.breakeven,2)}/hr breakeven this job costs ${$(c.cost)} to run, leaving ${$(c.profit)} profit (${pct(c.margin)}).`;
  if(c.health==="not")t+=` That is below cost. Raise the price, reduce hours or crew, or add a heavy-duty charge.`;
  else if(c.health==="marginal")t+=` That covers costs but is under your ${S.fin.margin}% target; ${$(c.adj*c.rt.target)} would reach it.`;
  else t+=` That meets your ${S.fin.margin}% target.`;
  return t;
}
function vResults(){
  if(!R)return `<div class="empty soft"><h3>Enter the square footage to see the price</h3><p>The price builds line by line here, with the hours, cost and margin behind it, and the client quote with the Bright Touch checklist.</p></div>`;
  return `<div class="summary">
    <div class="row sp"><span class="lbl">${R.label}${E.service==="residential"&&E.tier==="min"?" · breakeven pricing":" · recommended"}</span></div>
    <div class="num">${$(R.price)}</div>
    <div class="per">${hrs(R.adj)} of labor · ${R.crew} cleaner${R.crew>1?"s":""} · about ${hrsNice(R.tos)} on site</div>
    ${E.service==="residential"?`<div class="tierbtns"><button class="${E.tier==="target"?"on":""}" onclick="setE('tier','target')"><small>Recommended rate</small><b>${$(R.priceAt.target)}</b></button><button class="${E.tier==="min"?"on":""}" onclick="setE('tier','min')"><small>Breakeven rate</small><b>${$(R.priceAt.min)}</b></button></div><p class="tiny sub" style="margin-top:8px">${E.tier==="min"?"Breakeven is your floor in a negotiation, never go below it.":"Tap Breakeven to see your floor if the client negotiates."}</p>`:""}
    <div class="acts"><button class="btn primary" onclick="downloadPDF()">${ic("print")} Download PDF quote</button><button class="btn ghost" onclick="openQuote()">Preview quote</button><button class="btn ghost" onclick="go('estimate')">${ic("plus")} New</button></div>
  </div>
  ${R.overridden?`<div class="note ok">${ic("info")}<div>Priced with your ${R.hours.toFixed(2)} labor hours (table estimated ${R.calcHours.toFixed(2)} h).</div></div>`:""}
  <div class="card"><h3 style="margin-bottom:8px">Price breakdown</h3><div class="lines">${R.lines.map(l=>`<div class="${l.disc?"disc":""}"><span>${l.n}<small>${l.s}</small></span><b>${l.v<0?"−":""}${l.v===0?"included":$(Math.abs(l.v))}</b></div>`).join("")}<div class="tot"><span>Total${(E.service==="residential"&&["weekly","biweekly","monthly"].includes(E.type))||(E.service==="commercial"&&S.com.types[E.ctype].recurring&&E.cfreq!=="once")?" per visit":""}</span><b>${$(R.price)}</b></div></div></div>
  <details class="card"><summary><h3>What's included · ${R.label}</h3>${ic("chev","chev")}</summary><div class="body"><div class="check">${checklist(R.chk)}</div></div></details>`;
}
function checklist(k){const c=CHK[k]||{};return Object.entries(c).map(([h,items])=>`<div><h4>${h}</h4><ul style="margin:0;padding:0">${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}

function downloadPDF(){openQuote();setTimeout(()=>window.print(),400)}
function closeQuote(){document.getElementById("modal").classList.remove("show")}

/* ---------- settings ---------- */
function setS(path,v){const p=path.split(".");let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=(isNaN(parseFloat(v))||path.startsWith("company"))?v:parseFloat(v);store("bt_settings_v7",S);if(path.startsWith("fin."))render()}
function sf(l,path,h="",step="any",type="number"){const v=path.split(".").reduce((o,k)=>o[k],S);return field(l,`<input type="${type}" step="${step}" ${type==="number"?'inputmode="decimal"':""} value="${v}" onchange="setS('${path}',this.value)">`,h)}
function setAddon(i,f,v){S.addons[i][f]=(f===1)?v:(parseFloat(v)||0);store("bt_settings_v7",S)}
function delAddon(i){S.addons.splice(i,1);store("bt_settings_v7",S);render()}
function addAddon(){S.addons.push(["x"+Date.now(),"New add-on",25,15,0]);store("bt_settings_v7",S);render()}
function setAreas(v){S.areas=v.split(",").map(s=>s.trim()).filter(Boolean);store("bt_settings_v7",S)}
function setRes(r,c,v){S.resTable[r][c]=parseFloat(v)||0;store("bt_settings_v7",S)}
function setTier(t,i,c,v){S.com.types[t].tiers[i][c]=parseFloat(v)||0;store("bt_settings_v7",S)}
function vSettings(){
  const rt=rates();
  return `<div class="page-head"><div><h1><span class="script">Cleaning Services</span>Settings & pricing</h1><p class="sub">Every number in the pricing structure, editable.</p></div></div>
  <div class="section-title"><h2>Residential price table</h2><span class="sub small">Recommended prices (target rate). Breakeven prices are 70% of these.</span></div>
  <div class="card" style="padding:4px 0"><div class="tbl-wrap"><table class="list"><thead><tr><th>Up to sqft</th>${S.resTypes.map(t=>`<th class="num">${t[1]}</th>`).join("")}</tr></thead><tbody>${S.resTable.map((row,r)=>`<tr><td><input class="cell num" type="number" value="${row[0]}" onchange="setRes(${r},0,this.value)" style="text-align:left"></td>${row.slice(1).map((v,c)=>`<td class="num"><input class="cell num" type="number" value="${v}" onchange="setRes(${r},${c+1},this.value)"></td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="tiny sub" style="padding:8px 14px 12px">Above 5,000 sqft the calculator extends the table by the same step per 500 sqft.</p></div>
  <div class="section-title"><h2>Commercial rates per sqft</h2><span class="sub small">Per visit · the rate drops as the site gets bigger</span></div>
  <div class="grid g2">${Object.entries(S.com.types).map(([k,t])=>`<div class="card"><h3 style="margin-bottom:4px">${t.name}</h3><p class="tiny sub" style="margin-bottom:10px">${t.recurring?"Recurring · frequency discounts apply":"One-time project"}</p><div class="tbl-wrap"><table class="list" style="min-width:0"><thead><tr><th>Up to sqft</th><th class="num">$ / sqft</th><th class="num">sqft / labor hr</th></tr></thead><tbody>${t.tiers.map((tr,i)=>`<tr><td>${i===t.tiers.length-1?"Above "+t.tiers[i-1][0].toLocaleString():`<input class="cell num" type="number" value="${tr[0]}" onchange="setTier('${k}',${i},0,this.value)" style="text-align:left">`}</td><td class="num"><input class="cell num" type="number" step="0.005" value="${tr[1]}" onchange="setTier('${k}',${i},1,this.value)"></td><td class="num"><input class="cell num" type="number" value="${tr[2]}" onchange="setTier('${k}',${i},2,this.value)"></td></tr>`).join("")}</tbody></table></div><div class="form-grid" style="margin-top:10px">${sf("Minimum charge ($)","com.types."+k+".min")}</div></div>`).join("")}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3 style="margin-bottom:12px">Commercial frequency (× per-visit price)</h3><div class="form-grid">${Object.entries(S.com.freq).map(([k,f])=>sf(f.name,"com.freq."+k+".m","","0.01")).join("")}${sf("Minutes per restroom fixture","com.fixtureMin")}</div></div>
    <div class="card"><h3 style="margin-bottom:12px">Condition, travel, carpet & laundry</h3><div class="form-grid">${["light","standard","heavy","extreme"].map(k=>sf("Condition "+k+" ×","cond."+k,"","0.05")).join("")}${Object.entries(S.travel).map(([k,t])=>sf(t.name+" ($)","travel."+k+".fee")).join("")}${sf("Carpet $/sqft","carpet.rate","","0.01")}${sf("Carpet production (sqft/h)","carpet.production")}${sf("Rug ($ each)","carpet.rug")}${sf("Upholstery ($ per piece)","carpet.uph")}${sf("Twin comforter ($)","laundry.twin")}${sf("Queen comforter ($)","laundry.queen")}${sf("King comforter ($)","laundry.king")}${sf("Laundry minutes per item","laundry.minPerItem","","0.1")}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3 style="margin-bottom:12px">Company & service areas</h3><div class="form-grid"><div class="full">${sf("Name","company.name","","","text")}</div>${sf("Phone","company.phone","","","text")}${sf("Email","company.email","","","text")}<div class="full">${sf("Website","company.web","","","text")}</div><div class="full">${field("Service areas (comma-separated)",`<textarea onchange="setAreas(this.value)">${S.areas.join(", ")}</textarea>`)}</div></div></div>
  <div class="section-title"><h2>Add-on services menu</h2><span class="sub small">Price · labor minutes · per item</span></div>
  <div class="card" style="padding:4px 0"><div class="tbl-wrap"><table class="list"><thead><tr><th>Service</th><th class="num">Price ($)</th><th class="num">Minutes</th><th>Each</th><th></th></tr></thead><tbody>${(S.addons||[]).map((a,i)=>`<tr><td><input class="cell" value="${a[1]}" onchange="setAddon(${i},1,this.value)"></td><td class="num"><input class="cell num" type="number" value="${a[2]}" onchange="setAddon(${i},2,this.value)"></td><td class="num"><input class="cell num" type="number" value="${a[3]}" onchange="setAddon(${i},3,this.value)"></td><td><input type="checkbox" ${a[4]?"checked":""} onchange="setAddon(${i},4,this.checked?1:0)"></td><td style="text-align:right"><button class="btn danger sm" onclick="delAddon(${i})">${ic("trash")}</button></td></tr>`).join("")}</tbody></table></div><div style="padding:12px 14px"><button class="btn ghost sm" onclick="addAddon()">${ic("plus")} Add a service</button></div></div>
  <div style="margin-top:22px"><button class="btn ghost" onclick="if(confirm('Restore the Bright Touch defaults?')){S=JSON.parse(JSON.stringify(DEFAULTS));store('bt_settings_v7',S);render();toast('Defaults restored')}">Restore defaults</button></div>`;
}
render();
</script>
</body>
</html>
